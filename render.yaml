# Render Blueprint: free public demo of the API (Dashboard -> New -> Blueprint -> pick this repo).
# Database: Neon free Postgres (pgvector). Frontend: Vercel. No Redis/Mongo needed: with a single
# instance the app uses its in-memory cache, rate limiter and in-process event worker.
services:
  - type: web
    name: helpdesk-iq-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS          # your Vercel URL, e.g. https://helpdesk-iq.vercel.app
        sync: false
      - key: FRONTEND_URL          # same Vercel URL (used by the Google SSO redirect)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: claude
      - key: LLM_FALLBACK_PROVIDERS
        value: mock
      - key: LLM_DAILY_BUDGET_USD
        value: "1"
      - key: RATE_LIMIT_PER_MINUTE
        value: "15"
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: WEB_CONCURRENCY      # one process: in-memory cache/queue must be shared
        value: "1"
      - key: STORAGE_DIR
        value: /tmp/uploads
