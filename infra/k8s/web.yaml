apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: helpdesk-iq
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/helpdesk-iq-web:GIT_SHA
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: helpdesk-iq
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
