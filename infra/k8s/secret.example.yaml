# Example only. In production these come from AWS Secrets Manager via External Secrets Operator
# (or the Secrets Store CSI driver), never from a committed manifest.
apiVersion: v1
kind: Secret
metadata:
  name: helpdesk-secrets
  namespace: helpdesk-iq
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://helpdesk:CHANGE_ME@helpdesk-db.xxxx.ap-south-1.rds.amazonaws.com:5432/helpdesk
  REDIS_URL: rediss://helpdesk-cache.xxxx.cache.amazonaws.com:6379/0
  MONGO_URL: mongodb+srv://user:CHANGE_ME@cluster.example.mongodb.net
  JWT_SECRET: CHANGE_ME
  ANTHROPIC_API_KEY: CHANGE_ME
  AZURE_OPENAI_API_KEY: CHANGE_ME
  AZURE_OPENAI_ENDPOINT: https://CHANGE_ME.openai.azure.com
