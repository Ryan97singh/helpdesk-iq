# AWS Load Balancer Controller: one ALB, TLS from ACM, /api -> FastAPI, everything else -> web.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk
  namespace: helpdesk-iq
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:ACCOUNT:certificate/CHANGE_ME
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-south-1:ACCOUNT:regional/webacl/helpdesk/CHANGE_ME
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300  # long-lived SSE streams
spec:
  ingressClassName: alb
  rules:
    - host: helpdesk.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
