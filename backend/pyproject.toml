[project]
name = "helpdesk-iq"
version = "1.0.0"
description = "AI IT/HR helpdesk copilot - FastAPI backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S105", "S106", "B023", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
